apiVersion: v1
kind: ConfigMap
metadata:
  name: products-config
  namespace: products
data:
  APP_ENV: "development"
  ELASTICSEARCH_ENDPOINT: "http://elasticsearch:9200"
  DB_PORT: "5432"
  DB_USER: "postgres"
  DB_NAME: "products_db"
  ES_HOST: "elasticsearch"
  ES_PORT: "9200"
  ES_DISCOVERY_TYPE: "single-node"
  ES_SECURITY_ENABLED: "false"
  ES_JAVA_OPTS: "-Xms512m -Xmx512m"