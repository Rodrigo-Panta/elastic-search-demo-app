apiVersion: apps/v1
kind: Deployment
metadata: 
  name: products-api
  namespace: products
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: 
      app: products-api
  template:
    metadata:
      labels:
        app: products-api
    spec: 
      containers:
        - name: api
          image: rodrigopanta/products-api:v2.7
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: products-config
            - secretRef:
                name: products-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15     
            timeoutSeconds: 5     
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: products-api
  namespace: products
spec:
  type: ClusterIP
  selector:
    app: products-api
  ports:
    - name: http
      port: 8080
      targetPort: http